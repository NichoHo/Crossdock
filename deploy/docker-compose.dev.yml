services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crossdock
      POSTGRES_USER: crossdock
      POSTGRES_PASSWORD: crossdock
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crossdock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossdock -d crossdock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Event bus (Phase 2). Kafka API on 127.0.0.1:19092.
  redpanda:
    image: redpandadata/redpanda:v25.1.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - crossdock_redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  crossdock_pgdata:
  crossdock_redpanda:
