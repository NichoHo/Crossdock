# Single-host deployment (spec 13.5). Only Caddy publishes ports. Everything else
# is reachable on the Compose network alone, including PostgreSQL.
#
#   cp deploy/.env.example deploy/.env   # fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: crossdock

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2.9-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the public host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    <<: *restart
    build: ../web
    environment:
      CROSSDOCK_API_URL: http://api:8080
      CROSSDOCK_SERVICE_TOKEN: ${CROSSDOCK_SERVICE_TOKEN:?}
      CROSSDOCK_IDENTITY_SIGNING_KEY: ${CROSSDOCK_IDENTITY_SIGNING_KEY:?}
      CROSSDOCK_SESSION_SECRET: ${CROSSDOCK_SESSION_SECRET:?}
      CROSSDOCK_WEB_USERS: ${CROSSDOCK_WEB_USERS:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on: [api]

  migrate:
    build: ..
    command: ["migrate", "up"]
    environment:
      CROSSDOCK_DATABASE_URL: &dburl postgres://crossdock:${POSTGRES_PASSWORD:?}@db:5432/crossdock?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *restart
    build: ..
    command: ["serve"]
    environment:
      CROSSDOCK_DATABASE_URL: *dburl
      CROSSDOCK_LISTEN: ":8080"
      CROSSDOCK_SERVICE_TOKEN: ${CROSSDOCK_SERVICE_TOKEN:?}
      CROSSDOCK_IDENTITY_SIGNING_KEY: ${CROSSDOCK_IDENTITY_SIGNING_KEY:?}
      CROSSDOCK_SECRET_ENCRYPTION_KEY: ${CROSSDOCK_SECRET_ENCRYPTION_KEY:?}
      CROSSDOCK_BROKERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  # Scripted shifts so the dashboards always show a living system. Set SYNTHETIC_WAREHOUSE
  # to a warehouse made by `crossdock generate`; leave the profile off to stop it.
  synthetic:
    <<: *restart
    profiles: ["synthetic"]
    build: ..
    command: ["synthetic", "-warehouse", "${SYNTHETIC_WAREHOUSE:-wh-demo}", "-operators", "${SYNTHETIC_OPERATORS:-4}", "-every", "${SYNTHETIC_EVERY:-20s}"]
    environment:
      CROSSDOCK_API_URL: http://api:8080
      CROSSDOCK_SERVICE_TOKEN: ${CROSSDOCK_SERVICE_TOKEN:?}
      CROSSDOCK_IDENTITY_SIGNING_KEY: ${CROSSDOCK_IDENTITY_SIGNING_KEY:?}
    depends_on: [api]

  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crossdock
      POSTGRES_USER: crossdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossdock -d crossdock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v25.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    <<: *restart
    image: grafana/grafana:11.5.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # the board is the public face of the demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus]

  jaeger:
    <<: *restart
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      QUERY_BASE_PATH: /jaeger

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redpanda:
  prometheus:
  grafana:
